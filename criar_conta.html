<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de agendamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="formulario">
        <h1>Crie sua conta</h1>
        <p>Cadastre-se para começar a agendar salas e laboratórios</p>
        <form>
            <label for="nome">Nome completo:</label> 
            <input type="text" id="name" name="name" required autofocus> 
            
            <label for="email">Email</label> 
            <input type="email" id="email" name="email" required autofocus> 

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required autofocus> 

            <label for="novaSenha">Confirme sua senha:</label>
            <input type="password" id="novaSenha" name="novaSenha" required autofocusS> 
            
            <div class="botoes">
                <div class="botoes">
                <a href="index.html">
                    <button type="button">Entrar</button>
                </a>

                <button type="reset">Limpar</button>
            </div>
        </form>
    </div>
</body>
</html>
