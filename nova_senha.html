<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digite sua nova senha</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="formulario">
        <h1> Digite sua nova senha</h1>
        <p>Digite e confirme sua nova senha </p>
        <form>
            <label for="senha">Nova senha:</label> 
            <input type="password" id="senha" name="senha" required autofocus> 
            
            <label for="senha">Confirmar nova senha:</label> 
            <input type="password" id="senhaN" name="senhaN" required autofocus> 

            <div class="botoes">
                <button type="submit">Confirmar</button> 
                <button type="reset">Limpar</button>
            </div>
        </form>
    </div>
</body>
</html>
