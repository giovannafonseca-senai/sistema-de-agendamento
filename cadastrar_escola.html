    <aside class="menu_lateral">

    <main class="conteudoo">
        <h1>Cadastre sua escola</h1>
        <p>Cadastre sua escola para começar a agendar salas e laboratórios</p>
        <form action="analise_escola.html">
            <label for="nome">Nome da escola:</label> 
            <input type="text" id="nome" name="nome" required autofocus > 
            
             <label for="estado">Estado</label> 
            <input type="text" id="estado" name="estado" required autofocus > 
            
            
            <label for="cidade">Cidade</label> 
            <input type="text" id="cidade" name="cidade" required> 

            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" required > 

            <label for="novaSenha">Rua:</label>
            <input type="text" id="rua" name="rua" required> 

          
            
            <div class="botoes">
                <button type="submit">Confirmar</button> 
                <button type="reset">Limpar</button>
            </div>
        </form>
    </div>
</body>
